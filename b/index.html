<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, viewport-fit=cover">
<title>AI sizning ishingizni olmaydi — AI’ni biladigan xodim oladi</title>
<meta name="description" content="18–19-sentabr, soat 20:00. Bepul onlayn dars: AI bilan ishlashni o’rganib, oyiga 500–1000$ qo’shimcha daromadga chiqing.">
<meta name="theme-color" content="#FF5722">
<meta property="og:title" content="AI sizning ishingizni olmaydi — AI’ni biladigan xodim oladi">
<meta property="og:description" content="18–19-sentabr, 20:00 — bepul onlayn dars.">
<meta property="og:image" content="./assets/speaker.avif">
<meta property="og:type" content="website">
<link rel="icon" href="./assets/logo.avif">
<style>
@font-face{font-family:"Arrow";src:url(./fonts/inter-arrow.woff2) format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+2192}
@font-face{font-family:"Bebas Neue";src:url(./fonts/bebasneue.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--orange:#FF5722;--orange-2:#FF7F57;--soft:#F5F5F5;--dot:#FFDACE;--circle:#FFA284;--font:"Arrow",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;--font-buyan:"YU Buyan","Buyan","Bebas Neue","Arial Narrow",Arial,sans-serif;--stroke:.013em}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;overflow-x:hidden;background:#efefef;color:#000;font-family:var(--font);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}img{display:block;max-width:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}p,h1,h2{margin:0;padding:0}a{color:inherit;text-decoration:none}
.page{position:relative;width:390px;height:2292px;margin-inline:auto;overflow:hidden;background:#fff}
.n{position:absolute}.btn{display:block;user-select:none}
.fade{left:0;top:383px;width:390px;height:126px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 100%)}
.orbit{left:-52px;top:210px;width:494px;height:240px}
.person{left:62px;top:165px;width:249px;height:293px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.dot-1{left:45px;top:297px}.dot-2{left:123px;top:268px}.dot-3{left:258px;top:267px}.dot-4{left:336px;top:296px}
.chip{width:40px;height:40px;border:.817px solid var(--orange);border-radius:12.2577px;background:var(--soft)}
.chip-l{left:20px;top:14px}.chip-r{left:265px;top:14px;width:38px;height:38px;border-width:.8215px;border-radius:12.3224px}
.cal-ico{left:33px;top:26px;width:14.5px;height:14.5px}
.clock-ico{left:276.7px;top:25.3px;width:16.5px;height:15.9px}
.date-txt{left:68.6px;top:28.8px;width:78px;height:13px}
.time-txt{left:311.5px;top:27.8px;width:58px;height:13px}
.logo{left:172px;top:-2px;width:68px;height:68px}
.h1{left:20.5px;top:79.2px;width:349px;height:68px}
.form{left:20px;top:386px;width:350px;height:48px;border-radius:24px}
.form__plus{position:absolute;left:12px;top:-3px;width:27px;height:48px;font-size:40px;line-height:48px;color:#929292}
.form__send{position:absolute;left:314px;top:12px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--circle)}
.cta{left:27px;width:337.7px;height:80.7px;border-radius:74.07px;background:linear-gradient(90deg,var(--orange-2) 0%,var(--orange) 100%);box-shadow:0 4px 0 var(--orange-dark)}
.cta-1{top:458px}
.cta .lbl{position:absolute;left:65.2px;top:30.7px;width:180px;height:24px}
.cta .disc{position:absolute;left:270px;top:13px;width:56px;height:56px;border-radius:50%;background:#fff}
.cta .arw{position:absolute;left:292.6px;top:34.8px;width:10.4px;height:11.1px}
.timer{left:170px;top:565px;width:51px;height:28px;font-family:var(--font-buyan);font-weight:700;font-size:28px;line-height:28px;text-align:center;-webkit-text-stroke:var(--stroke);paint-order:stroke fill;font-variant-numeric:tabular-nums}
.h2{left:40.2px;top:625.2px;width:310px;height:28px}
</style>
<link rel="stylesheet" href="./css/main.css" media="print" onload="this.media='all'" />
<noscript>
  <link rel="stylesheet" href="./css/main.css" />
</noscript>
</head>
<body data-variant="3">

<main class="page">
  <div class="n fade"></div>
  <img class="n orbit" src="./assets/s3-orbit.avif" alt="" width="494" height="240" loading="lazy" decoding="async">
  <span class="n dot dot-1"></span>
  <span class="n dot dot-2"></span>
  <span class="n dot dot-3"></span>
  <span class="n dot dot-4"></span>
  <div class="n pill"></div>
  <img class="n person" src="./assets/speaker.avif" alt="Vebinar spikeri" width="249" height="293" loading="lazy" decoding="async">

  <div class="n chip chip-l"></div>
  <img class="n cal-ico" src="./assets/s3-cal.svg" alt="" width="15" height="15" loading="lazy" decoding="async">
  <img class="n date-txt" src="./assets/txt/date.svg" alt="18-19-sentabr" width="78" height="13" loading="lazy" decoding="async">
  <img class="n logo" src="./assets/logo.avif" alt="uStudy" width="68" height="68" loading="lazy" decoding="async">
  <div class="n chip chip-r"></div>
  <img class="n clock-ico" src="./assets/s3-clock.svg" alt="" width="17" height="16" loading="lazy" decoding="async">
  <img class="n time-txt" src="./assets/txt/time.svg" alt="Soat 20:00" width="58" height="13" loading="lazy" decoding="async">

  <h1><img class="n h1" src="./assets/txt/h1.svg" alt="AI sizning ishingizni olmaydi — AI’ni biladigan xodim oladi" width="349" height="68" loading="lazy" decoding="async"></h1>

  <button type="button" class="n form registerBtn" aria-label="Bepul qatnashish">
    <span class="form__plus">+</span>
    <span class="form__send">
      <svg width="10" height="11" viewBox="0 0 10 11" fill="none" aria-hidden="true">
        <path d="M5 10.5V1M5 1L1 5M5 1l4 4" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>

  <button type="button" class="n btn cta cta-1 registerBtn">
    <img class="lbl" src="./assets/txt/cta1.svg" alt="Bepul qatnashish" width="180" height="24" loading="lazy" decoding="async">
    <span class="disc"></span>
    <img class="arw" src="./assets/s3-btn-arrow.svg" alt="" width="11" height="12" loading="lazy" decoding="async">
  </button>

  <div class="n timer" data-timer="ms">01:59</div>

  <h2><img class="n h2" src="./assets/txt/h2.svg" alt="Bepul darsda o’rganasiz" width="310" height="28" loading="lazy" decoding="async"></h2>

  <div class="n card card-1"></div>
  <img class="n card-img card-img-1" src="./assets/s3-card1.avif" alt="" width="320" height="180" loading="lazy" decoding="async">
  <span class="n check check-1"></span>
  <img class="n tick tick-1" src="./assets/s3-check.svg" alt="" width="12" height="9" loading="lazy" decoding="async">
  <img class="n ct-1" src="./assets/txt/t1.svg" alt="AI’ga to’g’ri so’rov (prompt) berish formulasini o’rganasiz — yillab dasturlash o’rganmasdan sayt va Telegram bot yasang" width="271" height="50" loading="lazy" decoding="async">

  <div class="n card card-2"></div>
  <img class="n card-img card-img-2" src="./assets/s3-card2.avif" alt="" width="320" height="180" loading="lazy" decoding="async">
  <span class="n check check-2"></span>
  <img class="n tick tick-2" src="./assets/s3-check.svg" alt="" width="12" height="9" loading="lazy" decoding="async">
  <img class="n ct-2" src="./assets/txt/t2.svg" alt="AI orqali reklama videolari, rasm va dizayn postlar yasashni ko’rasiz — bunday videolar uchun bozorda 20–50$ to’lanmoqda" width="280" height="49" loading="lazy" decoding="async">

  <div class="n card card-3"></div>
  <img class="n card-img card-img-3" src="./assets/s3-card3.avif" alt="" width="320" height="180" loading="lazy" decoding="async">
  <span class="n check check-3"></span>
  <img class="n tick tick-3" src="./assets/s3-check.svg" alt="" width="12" height="9" loading="lazy" decoding="async">
  <img class="n ct-3" src="./assets/txt/t3.svg" alt="Bir kishiga SMM, videograf va storismaker uchun alohida pul to’lash o’rniga, bu ishlarni AI’ga qildirish tizimini olasiz" width="279" height="49" loading="lazy" decoding="async">

  <div class="n card card-4"></div>
  <img class="n card-img card-img-4" src="./assets/s3-card4.avif" alt="" width="320" height="180" loading="lazy" decoding="async">
  <span class="n check check-4"></span>
  <img class="n tick tick-4" src="./assets/s3-check.svg" alt="" width="12" height="9" loading="lazy" decoding="async">
  <img class="n ct-4" src="./assets/txt/t4.svg" alt="Hisobot, prezentatsiya va hujjatlaringizni AI bilan daqiqalarda tayyorlashni o’rganasiz soatlab ketadigan ish bir necha daqiqada" width="272" height="49" loading="lazy" decoding="async">

  <div class="n card card-5"></div>
  <img class="n card-img card-img-5" src="./assets/s3-card5.avif" alt="" width="320" height="180" loading="lazy" decoding="async">
  <span class="n check check-5"></span>
  <img class="n tick tick-5" src="./assets/s3-check.svg" alt="" width="12" height="9" loading="lazy" decoding="async">
  <img class="n ct-5" src="./assets/txt/t5.svg" alt="AI’ni o’rganib qo’shimcha oyiga 500–1000$ daromadga chiqish va birinchi mijozni topish qadamlarini bilib olasiz" width="273" height="51" loading="lazy" decoding="async">

  <button type="button" class="n btn cta cta-2 registerBtn">
    <img class="lbl" src="./assets/txt/cta2.svg" alt="Bepul qatnashish" width="180" height="24" loading="lazy" decoding="async">
    <span class="disc"></span>
    <img class="arw" src="./assets/s3-btn-arrow.svg" alt="" width="11" height="12" loading="lazy" decoding="async">
  </button>
</main>

<div id="registrationModal" class="homeModal" style="display: none">
  <div class="homeModalOverlay"></div>
  <div class="homeFormContainer">
    <button class="closeButton" id="closeModalBtn" aria-label="Yopish">
      <svg width="16" height="16" viewBox="0 0 12 12" fill="none">
        <path d="M1 11L11 1M1 1.00001L11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
    <div class="homeFormTop">
      <h2 class="homeFormTopTitle">Ro’yxatdan o’tish uchun ma’lumotlaringizni kiriting!</h2>
    </div>
    <form id="registrationForm" name="contact-form">
      <div class="HomeFormRow">
        <label class="HomeFormRowLabel" for="name">Ismingiz:</label>
        <input class="HomeFormRowInput" type="text" id="name" name="name" placeholder="Ismingizni kiriting" autocomplete="name" />
        <p class="homeFormErrorText" id="nameError" style="display: none">❌ Ismingizni kiriting!</p>
      </div>
      <div class="HomeFormRow">
        <label class="HomeFormRowLabel" for="phone">Telefon raqamingiz:</label>
        <div class="phone-input-container">
          <button type="button" class="selected-country" id="selectedCountry" aria-label="Davlat kodini tanlash">
            <span class="selected-flag" id="selectedCountryFlag">🇺🇿</span>
            <svg id="dropdownIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9" /></svg>
            <span class="selected-code" id="selectedCountryCodeText">+998</span>
          </button>
          <div class="country-dropdown" id="countryDropdown" style="display: none"></div>
          <div class="phone-field">
            <input class="HomeFormRowInput phone-input" type="tel" id="phone" name="phone" inputmode="numeric" placeholder="88 888 88 88" autocomplete="tel" style="border: none; background-color: transparent; padding-left: 5px" />
          </div>
        </div>
        <p class="homeFormErrorText" id="phoneError" style="display: none">❌ Telefon raqam mos emas!</p>
      </div>
      <button type="submit" class="HomeFormBtn" id="submitBtn">DAVOM ETISH</button>
    </form>
  </div>
</div>

<script defer src="../js/timer.js"></script>
<script defer src="../js/phoneFormatter.js"></script>
<script defer src="../js/app.js"></script>
</body>
</html>
